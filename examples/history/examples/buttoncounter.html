<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>Button Counter Example</title>
</head>
<body>
<main>
  <button-counter id="counter1"></button-counter>
  <button-counter id="counter2" count="10"></button-counter>
</main>
<script type="module">
import { Part, register } from '/lib/flatout.js';

class ButtonCounter extends Part {
  html() {
    return `<button id="button">You clicked me
      <span id="count"></span> times.
    </button>`
  }

  data() {
    return { count: 0 };
  }

  events() {
    return {
      button: {
        click: () => {
          this.set('count', this.get('count') + 1);
        }
      }
    }
  }
}

register({ 'button-counter': ButtonCounter });
</script>
</body>
</html>
