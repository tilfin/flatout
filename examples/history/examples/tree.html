<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width">
<title>flatout Tree View Example</title>
</head>
<body>
<tree-root></tree-root>

<script type="module">
import { View, Part, register } from '/lib/flatout.js';

const treeData = {
  name: "Root",
  children: [
    {
      name: "Taro",
      children: [
        {
          name: "Sanshiro"
        },
        {
          name: "Hanako"
        }
      ]
    }, {
      name: "Jiro",
      children: [
        {
          name: "Jiro jr."
        }
      ]
    },
    {
      name: "Saburo"
    }
  ]
};

class TreeNode extends Part {
  html(data) {
    return `\
    <style>
      :host {
        display: block;
        margin-left: 20px;
      }
      #name {
        cursor: pointer;
        user-select: none;
      }
      #name:hover {
        background-color: #eef;
      }
      #children {
        margin-top: 4px;
        margin-left: 12px;
        border-left: 1px solid #ccc;
        padding-left: 8px;
      }
    </style>
    <div>
      <p id="name"></p>
      <div id="children">
        <slot></slot>
      </div>
      <form id="addChildForm">
        <input type="text" name="cname"><input type="submit" value="Add child">
      </form>
    </div>`
  }

  data() {
    return {
      name: '',
      children: []
    }
  }

  get childElementName() {
    return 'tree-node';
  }

  events() {
    return {
      name: { 
        click: (p) => {
          const targetEl = this._findEl('children')
          if (targetEl.style.display === "none") {
            targetEl.style.display = "block";
          } else {
            targetEl.style.display = "none";
          }
        }
      },
      addChildForm: {
        submit: (form, evt) => {
          evt.preventDefault();
          const addedName = form.cname.value.trim();
          const newItem = { name: addedName, children: [] };
          this.set('children', [...this.get('children'), newItem]);
          form.cname.value = null;
        }
      }
    }
  }
}

class Tree extends Part {
  html() {
    return `<main>
      <tree-node id="root"></tree-node>
    </main>`
  }

  data() {
    return {
      root: treeData
    }
  }
}

register({ 'tree-root': Tree, 'tree-node': TreeNode })
</script>
</body>
</html>
